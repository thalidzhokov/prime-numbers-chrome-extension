<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Numbers</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>

    <!-- Navigation -->
    <nav>
      <div class="navigation">
        <div>
          <a href="#prime-numbers" class="active">
            <span class="icon">
              <img src="icons/number-13.svg" alt="Prime Numbers">
            </span>
            <span class="text">Prime Numbers</span>
          </a>
        </div>
        <div>
          <a href="#password-generator">
            <span class="icon">
              <img src="icons/password.svg" alt="Password Generator">
            </span>
            <span class="text">Password Generator</span>
          </a>
        </div>
        <div>
          <a href="#whoami">
            <span class="icon">
              <img src="icons/user.svg" alt="Who am I?">
            </span>
            <span class="text">Who am I?</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- Sections -->
    <div class="sections">

      <!-- Prime numbers -->
      <section id="prime-numbers">
      <header>
        <h1 class="title">
          <span class="symbol">&Popf;</span> 
          Prime Numbers
        </h1>
        <div class="configs">
          <div>
            <label for="min-number">From</label>
            <input id="min-number" type="number" min="1" max="999999" value="1">
          </div>
          <div>
            <label for="max-number">To</label>
            <input id="max-number" type="number" min="1" max="999999" value="1013">
          </div>
          <div class="button">
            <button id="get-prime-numbers">Get Prime Numbers</button>
          </div>
        </div>
      </header>

      <main class="prime-numbers-list">
        <div id="prime-numbers-list">
          <!-- <div class="prime-numbers-list-item"></div> -->
        </div>
      </main>
      </section>

      <!-- Password Generator -->
      <section id="password-generator">
        <header>
          <h1 class="title">
            <span class="symbol">&Wscr;</span> 
            Password Generator
          </h1>
          <div class="configs">
            <div>
              <label for="prime-numbers-uppercase">UPPERCASE</label>
              <input id="prime-numbers-uppercase" type="checkbox" checked>
            </div>
            <div>
              <label for="prime-numbers-lowercase">Digits 0-9</label>
              <input id="prime-numbers-lowercase" type="checkbox" checked>
            </div>
            <div>
              <label for="prime-numbers-special" data-special="!#$%&()*+,-./:;<=>?@[\]^_\{|}~">Special</label>
              <input id="prime-numbers-special" type="checkbox">
            </div>
            <div>
              <label for="prime-numbers-words">Words</label>
              <input id="prime-numbers-words" type="checkbox" checked>
            </div>
            <div class="password-length">
              <label for="password-length">Length</label>
              <input id="password-length" type="range" min="8" max="32" value="20">
            </div>
            <div class="button">
              <button id="generate-password">Generate Passwords</button>
            </div>
          </div>
        </header>
        <main>
          <div id="password-generator-results">
            <span>YourStrongPassword1@HEREis32Char</span>
          </div>
        </main>
      </section>

      <!-- Who am I? -->
      <section id="whoami">
        <header>
          <h1 class="title">
            <span class="symbol">&Hopf;</span> 
            Who am I?
          </h1>
        </header>
        <main></main>
      </section>

    </div>

    <!-- Footer -->
    <footer>
      <div class="copyright">
        <span>by <a href="https://github.com/thalidzhokov">Albert Thalidzhokov</a></span>
      </div>
    </footer>

    <script src="popup.js"></script>
    
</body>
</html>
