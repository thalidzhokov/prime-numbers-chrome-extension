<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Numbers</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <section id="prime-numbers">
    <nav>
      <div class="navigation">
        <div>
          <a href="#prime-numbers" class="active">
            <span class="icon">
              <img src="icons/number-13.svg" alt="Prime Numbers">
            </span>
            <span class="text">Prime Numbers</span>
          </a>
        </div>
        <div>
          <a href="#password-generator">
            <span class="icon">
              <img src="icons/password.svg" alt="Password Generator">
            </span>
            <span class="text">Password Generator</span>
          </a>
        </div>
        <div>
          <a href="#whoami">
            <span class="icon">
              <img src="icons/user.svg" alt="Who am I?">
            </span>
            <span class="text">Who am I?</span>
          </a>
        </div>
      </div>
    </nav>

    <header>
      <h1 class="title">
        <span class="symbol">&Popf;</span> 
        Prime Numbers
      </h1>
      <div class="configs">
        <div>
          <label for="min-number">From</label>
          <input id="min-number" value="1" inputmode="numeric" minlength="1" maxlength="6">
        </div>
        <div>
          <label for="max-number">To</label>
          <input id="max-number" value="1013" inputmode="numeric" minlength="1" maxlength="6">
        </div>
      </div>
    </header>

    <main class="prime-numbers-list">
      <div id="prime-numbers-list">
        <!-- <div class="prime-numbers-list-item"></div> -->
      </div>
    </main>
    </section>

    <section id="password-generator">
      <header>
        <h1 class="title">
          <span class="symbol">&Wscr;</span> 
          Password Generator
        </h1>
        <div class="configs">
          <div>
            <label for="password-length">Length</label>
            <input id="password-length" value="16" inputmode="numeric" minlength="8" maxlength="32">
          </div>
          <div>
            <button id="generate-password">Generate</button>
          </div>
        </div>
      </header>
      <main>
        <div id="password-generator-results">
          <div>
            <span>Буквы в верхнем и нижнем регистре</span>
            <span>Password</span>
          </div>
          <div>
            <span>Буквы и цифры</span>
            <span>Password1</span>
          </div>
          <div>
            <span>Буквы, цифры, символы</span>
            <span>Password1!</span>
          </div>
          <div>
            <span>Буквы, цифры, префикс</span>
            <span>PrefixPassword</span>
          </div>
        </div>
      </main>
    </section>

    <!-- Who am I? -->
    <section id="whoami">
      <header></header>
      <main></main>
    </section>

    <footer>
      <div class="copyright">
        <span>by <a href="https://github.com/thalidzhokov">Albert Thalidzhokov</a></span>
      </div>
    </footer>

    <script src="popup.js"></script>
    
</body>
</html>
