<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Простые числа</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1 class="popup__title">Prime numbers</h1>
      <h2 class="popup__subtitle">by <a href="https://github.com/thalidzhokov">Albert Thalidzhokov</a></h2>
      <div class="popup__configs">
        <div>
          <label for="min-number">от</label>
          <input id="min-number" value="1">
        </div>
        <div>
          <label for="max-number">до</label>
          <input id="max-number" value="1000">
        </div>
      </div>
      <ul id="prime-list" class="popup__list"></ul>
      </main>
      <script src="popup.js"></script>
  </body>
</html>
