<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Numbers</title>
    <link rel="stylesheet" href="css/popup.css" />
  </head>
  <body>
  <div class="container">
    <!-- Navigation -->
    <nav>
      <div class="navigation">
        <div>
          <a href="#prime-numbers" class="active" data-section-index="0">
            <span class="icon">
              <img src="icons/number-13.svg" alt="Prime Numbers">
            </span>
            <span class="text">Primes</span>
          </a>
        </div>
        <div>
          <a href="#password-generator" data-section-index="1">
            <span class="icon">
              <img src="icons/password.svg" alt="Password Generator">
            </span>
            <span class="text">Pass Gen</span>
          </a>
        </div>
        <div>
          <a href="#fingerprint" data-section-index="2">
            <span class="icon">
              <img src="icons/fingerprint.svg" alt="Fingerprint">
            </span>
            <span class="text">Fingerprint</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- Sections: outer viewport, inner sliding track -->
    <div class="sections">
      <div class="sections-track">

      <!-- Prime numbers -->
      <section id="tab-prime-numbers">
      <header>
        <h1 class="title">
          <span class="symbol">&Popf;</span> 
          Prime Numbers
        </h1>
        <div class="configs">
          <div>
            <label for="min-number">From</label>
            <input id="min-number" type="number" min="1" max="999999" value="1">
          </div>
          <div>
            <label for="max-number">To</label>
            <input id="max-number" type="number" min="1" max="999999" value="1013">
          </div>
          <div class="button">
            <button id="get-prime-numbers" type="button">Get Primes</button>
          </div>
        </div>
      </header>

      <main>
        <div id="prime-numbers-list"></div>
        <p id="prime-numbers-message" class="section-message" hidden></p>
      </main>
      </section>

      <!-- Password Generator -->
      <section id="tab-password-generator">
        <header>
          <h1 class="title">
            <span class="symbol">&Wscr;</span> 
            Password Generator
          </h1>
          <div class="configs">
            <div class="password-toggle-row">
              <div>
                <label for="password-uppercase">Uppercase</label>
                <input id="password-uppercase" type="checkbox" checked>
              </div>
              <div>
                <label for="password-digits">Digits 0–9</label>
                <input id="password-digits" type="checkbox" checked>
              </div>
              <div>
                <label for="password-special">Special</label>
                <input id="password-special" type="checkbox">
              </div>
            </div>
            <div class="password-length">
              <label for="password-length">Length</label>
              <input id="password-length" type="range" min="8" max="32" value="20">
            </div>
            <div class="button">
              <button id="generate-password" type="button">Generate Passwords</button>
            </div>
          </div>
        </header>
        <main>
          <div id="password-generator-results"></div>
          <p id="password-generator-message" class="section-message" hidden></p>
        </main>
      </section>

      <!-- Fingerprint -->
      <section id="tab-fingerprint">
        <header>
          <h1 class="title">
            <span class="symbol">&Hopf;</span> 
            Fingerprint
          </h1>
        </header>
        <main>
          <div id="fingerprint-results"></div>
        </main>
      </section>

      </div>
    </div>

    <!-- Footer disabled -->

    <script src="js/vendor/fp.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/prime-numbers.js"></script>
    <script src="js/password-generator.js"></script>
    <script src="js/fingerprint.js"></script>
    <script src="js/popup.js"></script>
</div>
</body>
</html>
